name: Expire shared report

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace report after expiry
        shell: bash
        run: |
          expires_at="$(node -e "console.log(require('./expires.json').expires_at)")"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$now" < "$expires_at" ]]; then
            echo "Not expired yet: now=$now expires_at=$expires_at"
            exit 0
          fi
          cp expired.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expire shared report" || exit 0
          git push
